<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#115e59" />
    <title>C-Money | Cluster Mutiara Residence Sumberjaya</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Perbaikan V4.1: Pastikan Desktop & Mobile selalu bisa di-scroll penuh ke bawah */
      html,
      body,
      #root {
        height: auto !important;
        min-height: 100vh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scroll-behavior: smooth;
      }

      /* Scrollbar rapi untuk tampilan Desktop */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #0f766e;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #115e59;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
